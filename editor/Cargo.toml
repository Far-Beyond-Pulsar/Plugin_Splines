[package]
name = "splines_editor"
version = "0.1.0"
edition = "2024"
description = "Splines (pulsar.splines): the editor crate -- the Spline tool mode, its panel and the assistant's spline tools, over the plugin's component crate"

[lib]
name = "splines_editor"

[dependencies]
splines_component = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }
rust-i18n = { workspace = true }
gpui-ce = { workspace = true }
ui = { workspace = true }
ui_common = { workspace = true }
glam = { workspace = true }
pulsar_scenedb = { workspace = true }
engine_backend = { workspace = true }
tool_registry = { workspace = true }
tool_registry_macros = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The unit tests register `SplineComponent`'s class themselves (`lib.rs`).
pulsar_world_registry = { workspace = true }

[lints]
workspace = true
