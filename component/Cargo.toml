[package]
name = "splines_component"
version = "0.1.0"
edition = "2024"
description = "Splines (pulsar.splines): the spline component, its script methods and the editor lines it draws through the renderer's debug draw"

# The plugin's root crate (`splines_plugin`) links it and submits its
# component class and editor lines.
[lib]
name = "splines_component"

[dependencies]
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_scene_model = { workspace = true }
# The engine's editor-line trait. The game's slim feature set (as
# pulsar_game): linking the plugin must not pull the editor's features into
# a game build. A path dependency because the workspace table cannot opt out
# of default features.
engine_backend = { path = "../../../../crates/core/engine_backend", default-features = false, features = ["render"] }
# The engine-class derive logs through it.
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
glam = { workspace = true }
helio = { workspace = true }

[lints]
workspace = true
